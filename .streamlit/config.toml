# Config para correr detras del reverse proxy de Render (que a su vez esta
# detras de Cloudflare). server.port/server.address se siguen pasando por
# CLI en el Start Command (dependen de $PORT, que Render define en runtime).

[server]
headless = true
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

# Tema: el color primario de Streamlit (seleccion, foco, toggles) es rojo
# por defecto; se reemplaza por el azul de marca (--hwc-blue en app.py) para
# que los controles nativos sean coherentes con el resto de la identidad.
[theme]
base = "light"
primaryColor = "#2D79AB"
textColor = "#1F2933"
